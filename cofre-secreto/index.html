<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cofre Secreto</title>
  <style>
    :root {
      --bg1: #0f172a;
      --bg2: #111827;
      --panel: rgba(15, 23, 42, 0.9);
      --panel-alt: rgba(17, 24, 39, 0.85);
      --accent: #22c55e;
      --accent-2: #38bdf8;
      --warn: #fbbf24;
      --danger: #f87171;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --shadow: 0 20px 45px rgba(0, 0, 0, 0.38);
      --border: rgba(148, 163, 184, 0.22);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top, rgba(56, 189, 248, 0.18), transparent 35%),
        radial-gradient(circle at bottom right, rgba(34, 197, 94, 0.16), transparent 30%),
        linear-gradient(135deg, var(--bg1), var(--bg2));
      color: var(--text);
      padding: 24px;
    }

    .app {
      width: min(960px, 100%);
      background: rgba(15, 23, 42, 0.72);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, rgba(34, 197, 94, 0.18), rgba(56, 189, 248, 0.12));
      border-bottom: 1px solid var(--border);
      padding: 28px 28px 20px;
    }

    .title {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-weight: 800;
      font-size: clamp(1.8rem, 3vw, 2.8rem);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #f8fafc;
    }

    .lock {
      font-size: 2rem;
      filter: drop-shadow(0 0 12px rgba(34, 197, 94, 0.45));
    }

    .subtitle {
      text-align: center;
      margin-top: 10px;
      color: var(--muted);
      font-size: 1rem;
    }

    .content {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 22px;
      padding: 24px 28px 28px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 20px;
    }

    .panel h3 {
      font-size: 1.05rem;
      margin-bottom: 16px;
      color: #f1f5f9;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .guess-box {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 18px 0 12px;
      flex-wrap: wrap;
    }

    .digit-input {
      width: 58px;
      height: 64px;
      border-radius: 14px;
      border: 1px solid rgba(148, 163, 184, 0.28);
      background: rgba(15, 23, 42, 0.8);
      color: #f8fafc;
      font-size: 2rem;
      font-weight: 700;
      text-align: center;
      outline: none;
      transition: 0.2s ease all;
      box-shadow: inset 0 0 0 1px rgba(148, 163, 184, 0.1);
    }

    .digit-input:focus {
      border-color: var(--accent-2);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.18);
    }

    .actions {
      display: flex;
      gap: 12px;
      margin-top: 18px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 12px 18px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.2s ease, filter 0.2s ease;
    }

    button:hover {
      transform: translateY(-1px);
    }

    .primary {
      background: linear-gradient(135deg, var(--accent), #16a34a);
      color: white;
      box-shadow: 0 10px 20px rgba(34, 197, 94, 0.25);
    }

    .secondary {
      background: rgba(148, 163, 184, 0.08);
      color: var(--text);
      border: 1px solid rgba(148, 163, 184, 0.2);
    }

    .status {
      margin-top: 18px;
      min-height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      border-radius: 14px;
      background: rgba(56, 189, 248, 0.08);
      border: 1px solid rgba(56, 189, 248, 0.25);
      color: #dbeafe;
      padding: 12px;
      font-size: 0.98rem;
      line-height: 1.5;
    }

    .status.error {
      background: rgba(248, 113, 113, 0.08);
      border-color: rgba(248, 113, 113, 0.3);
      color: #fecaca;
    }

    .status.success {
      background: rgba(34, 197, 94, 0.08);
      border-color: rgba(34, 197, 94, 0.3);
      color: #dcfce7;
    }

    .status.warn {
      background: rgba(251, 191, 36, 0.08);
      border-color: rgba(251, 191, 36, 0.3);
      color: #fef3c7;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .stat-card {
      background: rgba(148, 163, 184, 0.05);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 12px;
      text-align: center;
    }

    .stat-label {
      color: var(--muted);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 6px;
    }

    .stat-value {
      font-size: 1.6rem;
      font-weight: 800;
      color: #f8fafc;
    }

    .history {
      margin-top: 18px;
      max-height: 420px;
      overflow: auto;
      padding-right: 4px;
    }

    .history::-webkit-scrollbar {
      width: 8px;
    }

    .history::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.2);
      border-radius: 999px;
    }

    .attempt {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: rgba(148, 163, 184, 0.04);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 10px;
      margin-bottom: 10px;
    }

    .attempt-code {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: 0.18em;
      color: #f8fafc;
    }

    .attempt-meta {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.8rem;
      color: var(--muted);
      text-align: right;
    }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.75rem;
      letter-spacing: 0.04em;
    }

    .green {
      background: rgba(34, 197, 94, 0.12);
      color: #bbf7d0;
      border: 1px solid rgba(34, 197, 94, 0.25);
    }

    .blue {
      background: rgba(56, 189, 248, 0.12);
      color: #bae6fd;
      border: 1px solid rgba(56, 189, 248, 0.25);
    }

    @media (max-width: 720px) {
      .content {
        grid-template-columns: 1fr;
      }

      .guess-box {
        gap: 8px;
      }

      .digit-input {
        width: 48px;
        height: 58px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="title">
        <span class="lock">🔐</span>
        <span>Cofre Secreto</span>
      </div>
      <div class="subtitle">Descubra a senha de 4 dígitos sem repetir números.</div>
    </div>

    <div class="content">
      <section class="panel">
        <h3>Nova tentativa</h3>

        <div class="guess-box">
          <input class="digit-input" type="text" maxlength="1" inputmode="numeric" />
          <input class="digit-input" type="text" maxlength="1" inputmode="numeric" />
          <input class="digit-input" type="text" maxlength="1" inputmode="numeric" />
          <input class="digit-input" type="text" maxlength="1" inputmode="numeric" />
        </div>

        <div class="actions">
          <button class="primary" id="submitBtn">Verificar senha</button>
          <button class="secondary" id="restartBtn">Nova partida</button>
        </div>

        <div id="status" class="status">
          Você tem 20 tentativas. Digite uma senha válida de 4 dígitos.
        </div>
      </section>

      <aside class="panel">
        <h3>Resumo</h3>

        <div class="stats">
          <div class="stat-card">
            <div class="stat-label">Tentativas</div>
            <div class="stat-value" id="attemptsLeft">20</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Status</div>
            <div class="stat-value" id="stateValue">ATIVO</div>
          </div>
        </div>

        <div style="margin-top: 18px;">
          <h3 style="margin-bottom: 12px;">Histórico</h3>
          <div id="history" class="history"></div>
        </div>
      </aside>
    </div>
  </div>

  <script>
    const secretCode = generateSecret();
    const inputs = [...document.querySelectorAll(".digit-input")];
    const submitBtn = document.getElementById("submitBtn");
    const restartBtn = document.getElementById("restartBtn");
    const statusEl = document.getElementById("status");
    const attemptsLeftEl = document.getElementById("attemptsLeft");
    const stateValueEl = document.getElementById("stateValue");
    const historyEl = document.getElementById("history");

    let attemptsLeft = 20;
    let gameOver = false;

    function generateSecret() {
      const digits = Array.from({ length: 10 }, (_, i) => String(i));
      const shuffled = digits.sort(() => Math.random() - 0.5);
      return shuffled.slice(0, 4).join("");
    }

    function setStatus(message, type = "") {
      statusEl.textContent = message;
      statusEl.className = "status";
      if (type) statusEl.classList.add(type);
    }

    function focusNext(index) {
      if (index < inputs.length - 1) {
        inputs[index + 1].focus();
      }
    }

    function getCurrentGuess() {
      return inputs.map(input => input.value).join("");
    }

    function clearInputs() {
      inputs.forEach(input => {
        input.value = "";
        input.disabled = false;
      });
      inputs[0].focus();
    }

    function disableInputs() {
      inputs.forEach(input => input.disabled = true);
    }

    function renderHistory() {
      historyEl.innerHTML = "";
      const attempts = JSON.parse(localStorage.getItem("cofreHistorico") || "[]");

      if (!attempts.length) {
        historyEl.innerHTML = "<div style='color: var(--muted); text-align: center; opacity: 0.8;'>Sem tentativas ainda.</div>";
        return;
      }

      attempts.forEach(item => {
        const row = document.createElement("div");
        row.className = "attempt";

        const code = document.createElement("div");
        code.className = "attempt-code";
        code.textContent = item.guess;

        const meta = document.createElement("div");
        meta.className = "attempt-meta";

        const badges = document.createElement("div");
        badges.innerHTML = `
          <span class="badge green">Certos: ${item.certos}</span>
          <span class="badge blue">Errados: ${item.lugarErrado}</span>
        `;
        meta.appendChild(badges);

        row.appendChild(code);
        row.appendChild(meta);
        historyEl.appendChild(row);
      });
    }

    function saveAttempt(guess, certos, lugarErrado) {
      const attempts = JSON.parse(localStorage.getItem("cofreHistorico") || "[]");
      attempts.unshift({ guess, certos, lugarErrado });
      localStorage.setItem("cofreHistorico", JSON.stringify(attempts.slice(0, 10)));
    }

    function calculateFeedback(guess, secret) {
      let certos = 0;
      let lugarErrado = 0;

      for (let i = 0; i < 4; i++) {
        if (guess[i] === secret[i]) {
          certos++;
        } else if (secret.includes(guess[i])) {
          lugarErrado++;
        }
      }

      return { certos, lugarErrado };
    }

    function handleGuess() {
      if (gameOver) return;

      const guess = getCurrentGuess();

      if (guess.length !== 4 || !/^\d+$/.test(guess)) {
        setStatus("Digite exatamente 4 dígitos válidos.", "error");
        return;
      }

      if (new Set(guess).size !== 4) {
        setStatus("Não repita dígitos na senha. Tente outra combinação.", "error");
        return;
      }

      const { certos, lugarErrado } = calculateFeedback(guess, secretCode);

      attemptsLeft--;
      attemptsLeftEl.textContent = attemptsLeft;

      saveAttempt(guess, certos, lugarErrado);
      renderHistory();

      if (certos === 4) {
        stateValueEl.textContent = "VENCEU";
        setStatus(`COFRE ABERTO! Você acertou a senha: ${guess}`, "success");
        gameOver = true;
        disableInputs();
        return;
      }

      if (attemptsLeft === 0) {
        stateValueEl.textContent = "PERDEU";
        setStatus(`Você perdeu! A senha secreta era: ${secretCode}`, "warn");
        gameOver = true;
        disableInputs();
        return;
      }

      stateValueEl.textContent = "ATIVO";
      setStatus(`Dígitos no lugar certo: ${certos} | Dígitos no lugar errado: ${lugarErrado} | Tentativas restantes: ${attemptsLeft}`, "warn");

      clearInputs();
    }

    function resetGame() {
      localStorage.removeItem("cofreHistorico");
      historyEl.innerHTML = "";
      stateValueEl.textContent = "ATIVO";
      attemptsLeft = 20;
      attemptsLeftEl.textContent = attemptsLeft;
      gameOver = false;
      clearInputs();
      setStatus("Você tem 20 tentativas. Digite uma senha válida de 4 dígitos.");
    }

    inputs.forEach((input, index) => {
      input.addEventListener("input", () => {
        input.value = input.value.replace(/\D/g, "").slice(0, 1);
        if (input.value && index < inputs.length - 1) {
          focusNext(index);
        }
      });

      input.addEventListener("keydown", (event) => {
        if (event.key === "Backspace" && !input.value && index > 0) {
          inputs[index - 1].focus();
        }

        if (event.key === "Enter") {
          handleGuess();
        }
      });
    });

    submitBtn.addEventListener("click", handleGuess);
    restartBtn.addEventListener("click", resetGame);

    clearInputs();
    renderHistory();
  </script>
</body>
</html>
