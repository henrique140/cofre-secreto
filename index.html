<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cofre Secreto - 8-Bit Edition</title>
  <!-- Fonte 8-bit clássica do Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #09090b;
      --surface: #18181b;
      --border: #27272a;
      --text: #fafafa;
      --muted: #a1a1aa;
      --primary: #ffffff;
      --primary-fg: #000000;
      --danger: #ef4444;
      --success: #10b981;
      --warn: #f59e0b;
      --radius: 8px; /* Cantos um pouco mais retos para combinar com o estilo pixel */
      --shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Press Start 2P', monospace; /* Fonte alterada */
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
    }

    .app {
      width: min(800px, 100%);
      background: var(--bg);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    .header {
      text-align: center;
      padding-top: 24px;
    }

    .title {
      font-size: 1.25rem; /* Reduzido pois a fonte 8-bit é bem larga */
      color: var(--text);
      margin-bottom: 12px;
      line-height: 1.4;
      text-shadow: 2px 2px 0px rgba(255,255,255,0.1);
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.65rem;
      line-height: 1.6;
    }

    .content {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 24px;
      align-items: start;
    }

    .panel {
      background: var(--surface);
      border: 2px solid var(--border); /* Bordas mais grossas combinam mais com pixel art */
      border-radius: var(--radius);
      padding: 28px;
      box-shadow: var(--shadow);
    }

    .panel-title {
      font-size: 0.7rem;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .guess-box {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-bottom: 32px;
    }

    .digit-input {
      width: 64px;
      height: 76px;
      border-radius: var(--radius);
      border: 2px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 1.8rem;
      text-align: center;
      outline: none;
      transition: all 0.2s ease;
      text-transform: uppercase;
    }

    .digit-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.1);
      transform: translateY(-4px);
    }

    .digit-input:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .actions {
      display: flex;
      gap: 12px;
    }

    button {
      flex: 1;
      border: 2px solid transparent;
      border-radius: var(--radius);
      padding: 16px;
      font-size: 0.7rem;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
    }

    .primary {
      background: var(--primary);
      color: var(--primary-fg);
    }

    .primary:hover {
      background: #e4e4e7;
      transform: scale(1.02);
    }

    .secondary {
      background: transparent;
      color: var(--text);
      border: 2px solid var(--border);
    }

    .secondary:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: var(--muted);
    }

    .status {
      margin-top: 24px;
      padding: 16px;
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.03);
      color: var(--muted);
      font-size: 0.65rem;
      line-height: 1.8;
      text-align: center;
      border: 2px solid transparent;
      transition: all 0.3s ease;
    }

    .status.error {
      background: rgba(239, 68, 68, 0.1);
      border-color: rgba(239, 68, 68, 0.3);
      color: var(--danger);
    }

    .status.success {
      background: rgba(16, 185, 129, 0.1);
      border-color: rgba(16, 185, 129, 0.3);
      color: var(--success);
    }

    .status.warn {
      background: rgba(245, 158, 11, 0.1);
      border-color: rgba(245, 158, 11, 0.3);
      color: var(--warn);
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 32px;
    }

    .stat-card {
      background: var(--bg);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      text-align: center;
    }

    .stat-label {
      color: var(--muted);
      font-size: 0.55rem;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .stat-value {
      font-size: 1rem;
      color: var(--text);
    }

    .history {
      max-height: 300px;
      overflow-y: auto;
      padding-right: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .history::-webkit-scrollbar {
      width: 8px;
    }

    .history::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 0px; /* Quadrado para estilo pixel */
    }

    .attempt {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      background: var(--bg);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .attempt-code {
      font-size: 0.9rem;
      letter-spacing: 0.1em;
    }

    .attempt-meta {
      display: flex;
      gap: 12px;
    }

    .indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.7rem;
      color: var(--muted);
    }

    /* Transformei os pontos em quadradinhos de pixel */
    .dot {
      width: 10px;
      height: 10px;
    }

    .dot.green { background: var(--success); }
    .dot.yellow { background: var(--warn); }

    @media (max-width: 768px) {
      .content {
        grid-template-columns: 1fr;
      }
      .guess-box {
        gap: 12px;
      }
      .digit-input {
        width: 54px;
        height: 64px;
        font-size: 1.4rem;
      }
      .title {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <h1 class="title">COFRE SECRETO</h1>
      <p class="subtitle">Descubra a senha de 4 digitos<br><br>sem repetir numeros.</p>
    </header>

    <main class="content">
      <section class="panel">
        <h2 class="panel-title">
          <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
          INSERIR CODIGO
        </h2>

        <div class="guess-box">
          <input class="digit-input" type="text" maxlength="1" inputmode="numeric" autocomplete="off" />
          <input class="digit-input" type="text" maxlength="1" inputmode="numeric" autocomplete="off" />
          <input class="digit-input" type="text" maxlength="1" inputmode="numeric" autocomplete="off" />
          <input class="digit-input" type="text" maxlength="1" inputmode="numeric" autocomplete="off" />
        </div>

        <div class="actions">
          <button class="primary" id="submitBtn">VERIFICAR</button>
          <button class="secondary" id="restartBtn">REINICIAR</button>
        </div>

        <div id="status" class="status">
          Voce tem 20 tentativas.<br>Digite uma senha
        </div>
      </section>

      <aside class="panel">
        <h2 class="panel-title">DASHBOARD</h2>

        <div class="stats">
          <div class="stat-card">
            <div class="stat-label">TENTATIVAS</div>
            <div class="stat-value" id="attemptsLeft">20</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">STATUS</div>
            <div class="stat-value" id="stateValue">ATIVO</div>
          </div>
        </div>

        <h2 class="panel-title">HISTORICO</h2>
        <div id="history" class="history"></div>
      </aside>
    </main>
  </div>

  <script>
    let secretCode = generateSecret();
    const inputs = [...document.querySelectorAll(".digit-input")];
    const submitBtn = document.getElementById("submitBtn");
    const restartBtn = document.getElementById("restartBtn");
    const statusEl = document.getElementById("status");
    const attemptsLeftEl = document.getElementById("attemptsLeft");
    const stateValueEl = document.getElementById("stateValue");
    const historyEl = document.getElementById("history");

    let attemptsLeft = 20;
    let gameOver = false;

    function generateSecret() {
      const digits = Array.from({ length: 10 }, (_, i) => String(i));
      const shuffled = digits.sort(() => Math.random() - 0.5);
      return shuffled.slice(0, 4).join("");
    }

    function setStatus(message, type = "") {
      statusEl.innerHTML = message;
      statusEl.className = "status";
      if (type) statusEl.classList.add(type);
    }

    function focusNext(index) {
      if (index < inputs.length - 1) {
        inputs[index + 1].focus();
      }
    }

    function getCurrentGuess() {
      return inputs.map(input => input.value).join("");
    }

    function clearInputs() {
      inputs.forEach(input => {
        input.value = "";
        input.disabled = false;
      });
      inputs[0].focus();
    }

    function disableInputs() {
      inputs.forEach(input => input.disabled = true);
    }

    function renderHistory() {
      historyEl.innerHTML = "";
      const attempts = JSON.parse(localStorage.getItem("cofreHistorico") || "[]");

      if (!attempts.length) {
        historyEl.innerHTML = "<div style='color: var(--muted); text-align: center; padding: 20px 0; font-size: 0.65rem; line-height: 1.5;'>Vazio.</div>";
        return;
      }

      attempts.forEach(item => {
        const row = document.createElement("div");
        row.className = "attempt";

        row.innerHTML = `
          <div class="attempt-code">${item.guess}</div>
          <div class="attempt-meta">
            <div class="indicator" title="Certo e na posição certa">
              <span class="dot green"></span> ${item.certos}
            </div>
            <div class="indicator" title="Certo mas na posição errada">
              <span class="dot yellow"></span> ${item.lugarErrado}
            </div>
          </div>
        `;
        historyEl.appendChild(row);
      });
    }

    function saveAttempt(guess, certos, lugarErrado) {
      const attempts = JSON.parse(localStorage.getItem("cofreHistorico") || "[]");
      attempts.unshift({ guess, certos, lugarErrado });
      localStorage.setItem("cofreHistorico", JSON.stringify(attempts.slice(0, 15)));
    }

    function calculateFeedback(guess, secret) {
      let certos = 0;
      let lugarErrado = 0;

      for (let i = 0; i < 4; i++) {
        if (guess[i] === secret[i]) {
          certos++;
        } else if (secret.includes(guess[i])) {
          lugarErrado++;
        }
      }

      return { certos, lugarErrado };
    }

    function handleGuess() {
      if (gameOver) return;

      const guess = getCurrentGuess();

      if (guess.length !== 4 || !/^\d+$/.test(guess)) {
        setStatus("Erro:<br>Digite 4 digitos.", "error");
        return;
      }

      if (new Set(guess).size !== 4) {
        setStatus("Erro:<br>Nao repita digitos.", "error");
        return;
      }

      const { certos, lugarErrado } = calculateFeedback(guess, secretCode);

      attemptsLeft--;
      attemptsLeftEl.textContent = attemptsLeft;

      saveAttempt(guess, certos, lugarErrado);
      renderHistory();

      if (certos === 4) {
        stateValueEl.textContent = "VENCEU";
        stateValueEl.style.color = "var(--success)";
        setStatus(`COFRE ABERTO!<br>Senha correta.`, "success");
        gameOver = true;
        disableInputs();
        return;
      }

      if (attemptsLeft === 0) {
        stateValueEl.textContent = "PERDEU";
        stateValueEl.style.color = "var(--danger)";
        setStatus(`GAME OVER!<br>A senha era: ${secretCode}`, "error");
        gameOver = true;
        disableInputs();
        return;
      }

      stateValueEl.textContent = "ATIVO";
      setStatus(`Quase lá!<br>Restam ${attemptsLeft} tentativas.`, "warn");
      clearInputs();
    }

    function resetGame() {
      secretCode = generateSecret(); 
      localStorage.removeItem("cofreHistorico");
      historyEl.innerHTML = "";
      stateValueEl.textContent = "ATIVO";
      stateValueEl.style.color = "var(--text)";
      attemptsLeft = 20;
      attemptsLeftEl.textContent = attemptsLeft;
      gameOver = false;
      clearInputs();
      setStatus("Voce tem 20 tentativas.<br>Digite uma senha.");
      renderHistory();
    }

    inputs.forEach((input, index) => {
      input.addEventListener("input", () => {
        input.value = input.value.replace(/\D/g, "").slice(0, 1);
        if (input.value && index < inputs.length - 1) {
          focusNext(index);
        }
      });

      input.addEventListener("keydown", (event) => {
        if (event.key === "Backspace") {
          if (input.value) {
            input.value = "";
            event.preventDefault();
            return;
          }
          if (index > 0) {
            inputs[index - 1].focus();
            inputs[index - 1].value = "";
            event.preventDefault();
          }
          return;
        }

        if (event.key === "Enter") {
          handleGuess();
        }
      });
    });

    submitBtn.addEventListener("click", handleGuess);
    restartBtn.addEventListener("click", resetGame);

    clearInputs();
    renderHistory();
  </script>
</body>
</html>
