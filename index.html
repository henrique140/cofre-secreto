<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cofre Secreto - 8-Bit Edition</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <h1 class="title">COFRE SECRETO</h1>
      <p class="subtitle">Descubra a senha de 4 digitos<br><br>sem repetir numeros.</p>
      <button id="soundToggle" class="secondary" style="width: auto; padding: 8px 14px; font-size: 0.6rem; margin-top: 14px;">SOM: ON</button>
    </header>

    <main class="content">
      <section class="panel">
        <h2 class="panel-title">
          <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
          </svg>
          INSERIR CODIGO
        </h2>

        <div class="guess-box">
          <input class="digit-input" type="text" maxlength="1" inputmode="numeric" autocomplete="off" />
          <input class="digit-input" type="text" maxlength="1" inputmode="numeric" autocomplete="off" />
          <input class="digit-input" type="text" maxlength="1" inputmode="numeric" autocomplete="off" />
          <input class="digit-input" type="text" maxlength="1" inputmode="numeric" autocomplete="off" />
        </div>

        <div class="actions">
          <button class="primary" id="submitBtn">VERIFICAR</button>
          <button class="secondary" id="restartBtn">REINICIAR</button>
        </div>

        <div id="status" class="status">
          Voce tem 20 tentativas.<br>Digite uma senha
        </div>
      </section>

      <aside class="panel">
        <h2 class="panel-title">DASHBOARD</h2>

        <div class="stats">
          <div class="stat-card">
            <div class="stat-label">TENTATIVAS</div>
            <div class="stat-value" id="attemptsLeft">20</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">STATUS</div>
            <div class="stat-value" id="stateValue">ATIVO</div>
          </div>
        </div>

        <h2 class="panel-title">HISTORICO</h2>
        <div id="history" class="history"></div>
      </aside>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
